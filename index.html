<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantra of Abundance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0f2e 0%, #05020a 100%);
            color: #d4af37; /* Gold */
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .mantra-container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 3s ease-out forwards;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .mantra-line {
            font-size: 1.5rem;
            line-height: 2;
            margin: 1rem 0;
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .mantra-line:nth-child(2) { animation-delay: 1.5s; }
        .mantra-line:nth-child(3) { animation-delay: 3s; }
        .mantra-line:nth-child(4) { animation-delay: 4.5s; }
        .mantra-line:nth-child(5) { animation-delay: 6s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .breathe-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 5;
            animation: breathe 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .mantra-line { font-size: 1.2rem; }
            .mantra-container { margin: 1rem; padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>
    <div class="breathe-circle"></div>

    <div class="mantra-container">
        <h1 id="mantra-title"></h1>
        <p class="mantra-line" id="line-1"></p>
        <p class="mantra-line" id="line-2"></p>
        <p class="mantra-line" id="line-3"></p>
        <p class="mantra-line" id="line-4"></p>
        <p class="mantra-line italic mt-6 text-xl" id="line-5"></p>
    </div>

    <script>
        // Language dictionaries
        const content = {
            pt: {
                title: "Mantra da Abundância",
                line1: "\"Eu sou um ímã para a prosperidade.\"",
                line2: "\"A riqueza flui para mim de forma fácil e constante.\"",
                line3: "\"Eu mereço o sucesso e aceito todas as bênçãos.\"",
                line4: "\"Minha mente cria oportunidades ilimitadas.\"",
                line5: "\"Eu sou grato.\""
            },
            en: {
                title: "Mantra of Abundance",
                line1: "\"I am a magnet for prosperity.\"",
                line2: "\"Wealth flows to me easily and constantly.\"",
                line3: "\"I deserve success and accept all blessings.\"",
                line4: "\"My mind creates unlimited opportunities.\"",
                line5: "\"I am grateful.\""
            }
        };

        // Detect user language
        const userLang = navigator.language || navigator.userLanguage;
        const currentLang = userLang.toLowerCase().startsWith('pt') ? 'pt' : 'en';

        // Apply translations
        document.getElementById('mantra-title').innerText = content[currentLang].title;
        document.getElementById('line-1').innerText = content[currentLang].line1;
        document.getElementById('line-2').innerText = content[currentLang].line2;
        document.getElementById('line-3').innerText = content[currentLang].line3;
        document.getElementById('line-4').innerText = content[currentLang].line4;
        document.getElementById('line-5').innerText = content[currentLang].line5;
        document.documentElement.lang = currentLang;

        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * 0.5 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;

                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            initParticles();
            animate();
        };
    </script>
</body>
</html>
